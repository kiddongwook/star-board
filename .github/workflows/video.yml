name: Make Videos

# 매일 수집이 끝나면 HyperFrames로 영상을 만든다.
#   영어 내레이션 + 한국어 자막, 진행 캐릭터 Starby
#   daily     : 오늘 급상승 Top 5 쇼츠
#   spotlight : 오늘 급상승 저장소 3개 각각의 특징 소개 쇼츠 (README 기반)
#   weekly    : 월요일(KST)에만 주간 리포트 (가로)
# 결과는 그날의 board-YYYY-MM-DD 릴리스에 첨부된다 (유튜브 업로드는 직접).
on:
  workflow_run:
    workflows: ["Collect & Deploy Star Board"]
    types: [completed]
  workflow_dispatch:
    inputs:
      type:
        description: "daily,spotlight,weekly 중 쉼표로 (all = 전부)"
        default: "daily,spotlight"

permissions:
  contents: write

concurrency:
  group: star-board-video
  cancel-in-progress: false

jobs:
  video:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg, Korean fonts, TTS, HyperFrames
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          pip install edge-tts
          npm install --no-save hyperframes gsap playwright@1
          npx playwright install --with-deps chromium
          # HyperFrames 고속 캡처(BeginFrame)용 chrome-headless-shell
          CHS=$(npx -y @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/.chs" | tail -1 | awk '{print $2}')
          if [ -x "$CHS" ]; then echo "HYPERFRAMES_BROWSER_PATH=$CHS" >> "$GITHUB_ENV"; echo "chrome-headless-shell: $CHS"; fi
          npx hyperframes doctor || true

      - name: Decide video types
        id: t
        run: |
          T="${{ github.event.inputs.type }}"
          if [ -z "$T" ]; then
            T="daily,spotlight"
            if [ "$(TZ=Asia/Seoul date +%u)" = "1" ]; then T="daily,spotlight,weekly"; fi
          fi
          echo "type=$T" >> "$GITHUB_OUTPUT"

      - name: Make videos (HyperFrames)
        id: hf
        continue-on-error: true
        env:
          HYPERFRAMES_NO_UPDATE_CHECK: "1"
          HYPERFRAMES_SKIP_SKILLS: "1"
        run: node video/hf-video.mjs --type "${{ steps.t.outputs.type }}" --out out

      - name: Fallback (static slideshow) if HyperFrames failed
        if: steps.hf.outcome == 'failure'
        run: |
          npx playwright install --with-deps chromium
          node video/make-video.mjs --type shorts --out out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos
          path: |
            out/*.mp4
            out/*.txt
            out/projects/**/index.html
          retention-days: 14

      - name: Attach to today's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DAY=$(node -e "console.log(require('./data/latest.json').generatedAt.slice(0,10))")
          TAG="board-$DAY"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Star Board $DAY" --notes "Daily board snapshot" --latest=false
          gh release upload "$TAG" out/*.mp4 out/*.txt --clobber
