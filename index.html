<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub Star Board</title>
<meta name="description" content="Daily GitHub star rankings with real-usage verification: trending, all-time stars, rookies, categories, hype vs. substance.">
<link rel="alternate" type="text/plain" href="llms.txt" title="LLM-readable data index">
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2129;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#2f81f7;--good:#3fb950;--warn:#d29922;--bad:#f85149;--gem:#a371f7;--doc:#39c5cf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Hiragino Sans","Microsoft YaHei",sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
header{padding:16px 24px 0;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:19px}
.meta{color:var(--muted);font-size:12px}
#uiLang{margin-left:auto;font-size:13px;padding:4px 8px}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 10px}
input,select{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font:inherit}
#q{width:260px}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{color:var(--text);border-bottom-color:#f78166;font-weight:600}
main{max-width:1240px;margin:0 auto;padding:18px 24px 60px}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:4px 12px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:#1f6feb33;border-color:var(--accent);color:var(--text)}
.note{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--muted);font-size:13px;margin-bottom:12px}
.note.warn{border-color:#d2992266;color:#e3b341;background:#d2992210}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--panel2);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover td{background:#1c212980}
.rank{color:var(--muted);width:34px}
.name{font-weight:600;font-size:14px}
.desc{color:var(--muted);font-size:12.5px;margin-top:2px;max-width:560px}
.topics{margin-top:4px}.topics span{display:inline-block;font-size:11px;color:var(--accent);background:#388bfd1a;border-radius:20px;padding:0 7px;margin:2px 3px 0 0}
.gain{color:var(--good);font-weight:700}.dn{color:var(--bad);font-weight:700}
.v{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;border:1px solid;white-space:nowrap}
.v-good{color:var(--good);border-color:#2ea04366;background:#2ea04318}
.v-hype{color:var(--warn);border-color:#d2992266;background:#d2992218}
.v-bad{color:var(--bad);border-color:#f8514966;background:#f8514918}
.v-gem,.v-mature{color:var(--gem);border-color:#a371f766;background:#a371f718}
.v-doc{color:var(--doc);border-color:#39c5cf55;background:#39c5cf14}
.v-quick,.v-na,.v-early,.v-archived,.v-dead{color:var(--muted);border-color:var(--border)}
.b{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:4px;margin-left:5px;vertical-align:2px;border:1px solid;white-space:nowrap}
.b-red{color:var(--bad);border-color:#f8514955}.b-yel{color:var(--warn);border-color:#d2992255}.b-gray{color:var(--muted);border-color:var(--border)}.b-blue{color:var(--accent);border-color:#388bfd55}
.s{font-weight:650}
.detail td{background:var(--panel2);padding:14px 16px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:10px}
.m{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 10px}
.m .k{font-size:11px;color:var(--muted)}.m .val{font-weight:650}
.why{margin:6px 0;padding-left:0;list-style:none}.why li{margin:2px 0}
.why .p{color:var(--good)}.why .mi{color:var(--bad)}.why .z{color:var(--muted)}
.more{display:block;margin:12px auto;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 18px;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer}
.card.on{border-color:var(--accent)}
.card b{display:block}.card .meta{margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.two{grid-template-columns:1fr}#q{width:100%}}
.box{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px}
.box h3{margin:0 0 8px;font-size:14px}
.mini{width:100%;border:0}.mini td{padding:5px 4px;border-bottom:1px solid var(--border);font-size:13px}
svg text{fill:var(--muted);font-size:11px}
.legend span{margin-right:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.guide h3{margin:18px 0 6px;font-size:14px}.guide li{margin:3px 0}.guide p{color:var(--muted)}
code{background:var(--panel2);padding:1px 6px;border-radius:4px}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>GitHub Star Board</h1>
    <span class="meta" id="meta"></span>
    <select id="uiLang" aria-label="Language">
      <option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">中文</option>
    </select>
  </div>
  <div class="controls">
    <input id="q">
    <select id="fLang"></select>
    <select id="fV"></select>
    <select id="fLic"></select>
    <label class="meta"><input type="checkbox" id="fAct"> <span id="lAct"></span></label>
    <label class="meta"><input type="checkbox" id="fArch"> <span id="lArch"></span></label>
  </div>
  <nav id="nav">
    <button data-t="trend" class="on"></button><button data-t="top"></button><button data-t="new"></button><button data-t="cat"></button>
    <button data-t="growth"></button><button data-t="real"></button><button data-t="guide"></button>
  </nav>
</header>
<main id="main"></main>

<script>document.write('<script src="data/data.js?t=' + Math.floor(Date.now() / 300000) + '"><\/script>');</script>
<script>

  const R = D.repos, k = {
    stars: x => R[x.n]?.s || 0, util: x => R[x.n]?.sc?.util ?? -1, pop: x => R[x.n]?.sc?.pop ?? -1, growth: x => R[x.n]?.sc?.g7 ?? -1,
    trust: x => R[x.n]?.sc?.trust ?? -1, bo: x => R[x.n]?.sc?.bo ?? -1, spd: x => (R[x.n]?.s || 0) / Math.max(1, (Date.now() - Date.parse(R[x.n]?.c || Date.now())) / 864e5),
  }[by];
  return k ? [...rows].sort((a, b) => k(b) - k(a)) : rows;
}
const sortSel = (id, cur) => `<select data-sort="${id}">${Object.entries(T.sorts).map(([v, l]) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
function growthCell(r) { if (r.g?.d7 != null) return `<span class="gain">+${fmt(r.g.d7)}</span>`; if (r.sc?.g7 != null) return `<span class="meta">~+${fmt(r.sc.g7)}</span>`; return '<span class="meta">-</span>'; }

function render() {
  const t = S.tab;
  let h = '';
  if (D.mode === 'deep' && D.starCheck === false && ['trend', 'real'].includes(t)) h += `<div class="note">${T.starCheckOff}</div>`;
  if (D.mode !== 'deep' && t !== 'guide') h += `<div class="note warn">${T.quickNoteTop}</div>`;
  if (t === 'trend') {
    h += `<div class="sub">${chips(Object.entries(T.periods), S.period, 'period')}<span style="width:12px"></span>${chips(D.trendingLanguages.map(l => [l, l || T.allLanguages]), S.tlang, 'tlang')}</div>`;
    h += `<div class="note">${T.trendNote}</div>`;
    h += table(D.trending[`${S.period}:${S.tlang || 'all'}`] || [], { extraHead: T.plusStars, extra: x => `<span class="gain">+${fmt(x.g)}</span>` });
  } else if (t === 'top') {
    h += `<div class="sub">${chips([['all', T.all]].concat(D.topLanguages.map(l => [l, l])), S.topLang, 'toplang')}<span style="flex:1"></span>${sortSel('topSort', S.topSort)}</div>`;
    h += table(sortRows((D.top[S.topLang] || []).map(n => ({ n })), S.topSort), { extraHead: T.growth7, extra: x => growthCell(D.repos[x.n]) });
  } else if (t === 'new') {
    h += `<div class="sub">${chips(D.rookieDays.map(d => [d, T.created(d)]), S.newDays, 'newdays')}</div><div class="note">${T.newNote}</div>`;
    h += table(sortRows((D.rookies[S.newDays] || []).map(n => ({ n })), 'spd'), { extraHead: T.perDay, extra: x => { const r = D.repos[x.n]; return `<b>${fmt(r.s / Math.max(1, (Date.now() - Date.parse(r.c)) / 864e5))}</b>`; } });
  } else if (t === 'cat') {
    h += `<div class="cards">${D.categories.map(c => { const good = c.repos.filter(n => ['good', 'gem', 'mature'].includes(D.repos[n]?.sc?.v)).length;
      return `<div class="card ${c.id === S.cat ? 'on' : ''}" data-cat="${c.id}"><b>${esc(catName(c))}</b><div class="meta">${T.catCard(c.repos.length, esc(c.repos[0] || '-'))}</div><div class="meta">${c.topics.map(x => '#' + x).join(' ')}${D.mode === 'deep' ? ` · ${T.verified(good)}` : ''}</div></div>`; }).join('')}</div>`;
    const c = D.categories.find(x => x.id === S.cat);
    if (c) h += `<div class="sub"><b>${esc(catName(c))}</b><span style="flex:1"></span>${sortSel('catSort', S.catSort)}</div>` + table(sortRows(c.repos.map(n => ({ n })), S.catSort), { extraHead: T.growth7, extra: x => growthCell(D.repos[x.n]) });
  } else if (t === 'growth') {
    h += `<div class="sub">${chips(Object.entries(T.gChips), S.gPeriod, 'gperiod')}</div>`;
    if (/^(up|down)/.test(S.gPeriod)) {
      const k = 'u' + S.gPeriod.slice(-1), up = S.gPeriod.startsWith('up');
      const rows = Object.values(D.repos).filter(r => r.sd?.[k] != null && (up ? r.sd[k] > 0 : r.sd[k] < 0)).map(r => ({ n: r.n, g: r.sd[k] })).sort((a, b) => up ? b.g - a.g : a.g - b.g);
      h += rows.length ? `<div class="note">${T.scoreNote(k === 'u1' ? T.prevRun(D.history.prev) : T.weekAgo(D.history.week))}</div>` + table(rows, { extraHead: T.change, extra: x => sdTxt(x.g) }) : `<div class="note">${T.scoreEmpty(k === 'u1')}</div>`;
    } else {
      const rows = Object.values(D.repos).filter(r => r.g?.[S.gPeriod] != null).map(r => ({ n: r.n, g: r.g[S.gPeriod] })).sort((a, b) => b.g - a.g);
      h += rows.length ? `<div class="note">${T.growthNote(D.history.days)}</div>` + table(rows, { extraHead: T.gain, extra: x => `<span class="gain">+${fmt(x.g)}</span>` }) : `<div class="note">${T.growthEmpty(D.history.days)}</div>`;
    }
  } else if (t === 'real') h += realView();
  else h += `<div class="box guide">${T.guide.map(([title, items]) => `<h3>${title}</h3><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>`).join('')}</div>`;
  main.innerHTML = h;
}

function realView() {
  const R = T.real;
  const all = Object.values(D.repos).filter(r => passFilter({ ...r, sc: { ...r.sc, v: $('#fV').value || r.sc?.v } }));
  const deep = all.filter(r => !r.sc.quick && r.sc.util != null);
  const pts = deep.length ? deep : all.filter(r => r.sc.util != null);
  const W = 620, H = 380, P = 40;
  const colorOf = v => ({ good: '#3fb950', hype: '#d29922', bad: '#f85149', gem: '#a371f7', mature: '#a371f7', doc: '#39c5cf' }[v] || '#8b949e');
  const x = v => P + (v / 100) * (W - P - 10), y = v => H - P - (v / 100) * (H - P - 10);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%">`;
  svg += `<rect x="${x(55)}" y="${y(100)}" width="${x(100) - x(55)}" height="${y(55) - y(100)}" fill="#2ea04312"/><rect x="${x(55)}" y="${y(55)}" width="${x(100) - x(55)}" height="${y(0) - y(55)}" fill="#d2992212"/><rect x="${x(0)}" y="${y(100)}" width="${x(55) - x(0)}" height="${y(55) - y(100)}" fill="#a371f710"/>`;
  svg += `<text x="${x(97)}" y="${y(97)}" text-anchor="end">${R.q.good}</text><text x="${x(97)}" y="${y(3)}" text-anchor="end">${R.q.hype}</text><text x="${x(3)}" y="${y(97)}">${R.q.gem}</text><text x="${x(3)}" y="${y(3)}">${R.q.early}</text>`;
  svg += `<line x1="${P}" y1="${H - P}" x2="${W - 10}" y2="${H - P}" stroke="#30363d"/><line x1="${P}" y1="10" x2="${P}" y2="${H - P}" stroke="#30363d"/>`;
  svg += `<text x="${(W + P) / 2}" y="${H - 10}" text-anchor="middle">${R.x}</text><text x="12" y="${H / 2}" transform="rotate(-90 12 ${H / 2})" text-anchor="middle">${R.y}</text>`;
  svg += pts.map(r => `<circle cx="${x(r.sc.pop).toFixed(1)}" cy="${y(r.sc.util).toFixed(1)}" r="${Math.max(2.5, Math.min(9, Math.log10(r.s + 1) * 1.6))}" fill="${colorOf(r.sc.v)}" fill-opacity=".55" data-open="${esc(r.n)}" style="cursor:pointer"><title>${esc(r.n)} · ${T.th.pop} ${r.sc.pop} · ${T.th.util} ${r.sc.util} · ${esc(vLabel(r))}</title></circle>`).join('');
  svg += '</svg>';
  const list = (v, title) => { const match = all.filter(r => r.sc.v === v); const rs = match.sort((a, b) => (b.s || 0) - (a.s || 0)).slice(0, 15);
    return `<div class="box"><h3>${title} <span class="meta">${R.n(match.length)}</span></h3>${rs.length ? `<table class="mini">${rs.map(r => `<tr><td><a href="https://github.com/${esc(r.n)}" target="_blank" rel="noopener">${esc(r.n)}</a><div class="meta">${esc(reasons(r).slice(0, 2).map(w => w[1]).join(' · '))}</div></td><td class="n">${fmt(r.s)}</td><td class="n" style="color:${col(r.sc.util)}">${r.sc.util ?? '-'}</td></tr>`).join('')}</table>` : `<div class="meta">${R.empty}</div>`}</div>`; };
  const lg = R.legend, cs = ['#3fb950', '#a371f7', '#d29922', '#f85149', '#39c5cf'];
  return `<div class="two"><div class="box"><h3>${R.title} <span class="meta">${R.count(!!deep.length, pts.length)}</span></h3>${svg}
    <div class="legend">${lg.map((l, i) => `<span><i style="background:${cs[i]}"></i>${l}</span>`).join('')}</div></div>
    ${list('gem', R.gem)}</div><div class="two" style="margin-top:14px">${list('hype', R.hype)}${list('bad', R.bad)}</div><div class="two" style="margin-top:14px">${list('mature', R.mature)}${list('good', R.good)}</div>`;
}

function onClick(e) {
  const el = e.target.closest('[data-period],[data-tlang],[data-toplang],[data-newdays],[data-cat],[data-gperiod],[data-more],[data-open]');
  if (!el || e.target.closest('a')) return;
  const ds = el.dataset;
  if (ds.period) S.period = ds.period; else if (ds.tlang !== undefined) S.tlang = ds.tlang; else if (ds.toplang) S.topLang = ds.toplang;
  else if (ds.newdays) S.newDays = +ds.newdays; else if (ds.cat) { S.cat = ds.cat; S.limit = 100; } else if (ds.gperiod) S.gPeriod = ds.gperiod;
  else if (ds.more) S.limit += 100;
  else if (ds.open) {
    if (S.tab === 'real') {
      $('#q').value = ds.open; S.tab = 'top'; S.topLang = 'all'; S.open = ds.open;
      document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x.dataset.t === 'top'));
      main.innerHTML = `<div class="note">${T.detailOf(esc(ds.open))}</div>` + table([{ n: ds.open }]); return;
    }
    S.open = S.open === ds.open ? null : ds.open;
  }
  render();
}
main.addEventListener('change', e => { const s = e.target.dataset.sort; if (s) { S[s] = e.target.value; render(); } });
$('#uiLang').addEventListener('change', e => applyLang(e.target.value));
if (D) init();
applyLang(LANG);
</script>
</body>
</html>
