<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub Star Board - 스타 순위 + 실효성 검증</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2129;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#2f81f7;--good:#3fb950;--warn:#d29922;--bad:#f85149;--gem:#a371f7;--doc:#39c5cf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
header{padding:16px 24px 0;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:19px}
.meta{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 10px}
input,select{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 10px;font:inherit}
#q{width:260px}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{color:var(--text);border-bottom-color:#f78166;font-weight:600}
main{max-width:1240px;margin:0 auto;padding:18px 24px 60px}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:4px 12px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:#1f6feb33;border-color:var(--accent);color:var(--text)}
.note{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--muted);font-size:13px;margin-bottom:12px}
.note.warn{border-color:#d2992266;color:#e3b341;background:#d2992210}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--panel2);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover td{background:#1c212980}
.rank{color:var(--muted);width:34px}
.name{font-weight:600;font-size:14px}
.desc{color:var(--muted);font-size:12.5px;margin-top:2px;max-width:560px}
.topics{margin-top:4px}.topics span{display:inline-block;font-size:11px;color:var(--accent);background:#388bfd1a;border-radius:20px;padding:0 7px;margin:2px 3px 0 0}
.gain{color:var(--good);font-weight:700}
.v{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;border:1px solid;white-space:nowrap}
.v-good{color:var(--good);border-color:#2ea04366;background:#2ea04318}
.v-hype{color:var(--warn);border-color:#d2992266;background:#d2992218}
.v-bad{color:var(--bad);border-color:#f8514966;background:#f8514918}
.v-gem,.v-mature{color:var(--gem);border-color:#a371f766;background:#a371f718}
.v-doc{color:var(--doc);border-color:#39c5cf55;background:#39c5cf14}
.v-quick,.v-na,.v-early,.v-archived{color:var(--muted);border-color:var(--border)}
.s{font-weight:650}
.detail td{background:var(--panel2);padding:14px 16px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:10px}
.m{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 10px}
.m .k{font-size:11px;color:var(--muted)}.m .val{font-weight:650}
.why{margin:6px 0;padding-left:0;list-style:none}.why li{margin:2px 0}
.why .p{color:var(--good)}.why .mi{color:var(--bad)}.why .z{color:var(--muted)}
.more{display:block;margin:12px auto;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 18px;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer}
.card.on{border-color:var(--accent)}
.card b{display:block}.card .meta{margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.two{grid-template-columns:1fr}#q{width:100%}}
.box{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px}
.box h3{margin:0 0 8px;font-size:14px}
.mini{width:100%;border:0}.mini td{padding:5px 4px;border-bottom:1px solid var(--border);font-size:13px}
svg text{fill:var(--muted);font-size:11px}
.legend span{margin-right:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.guide h3{margin:18px 0 6px;font-size:14px}.guide li{margin:3px 0}.guide p{color:var(--muted)}
code{background:var(--panel2);padding:1px 6px;border-radius:4px}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>GitHub Star Board</h1>
    <span class="meta" id="meta"></span>
  </div>
  <div class="controls">
    <input id="q" placeholder="저장소 / 설명 / 토픽 검색">
    <select id="fLang"><option value="">모든 언어</option></select>
    <select id="fV">
      <option value="">모든 판정</option><option value="good">검증된 인기</option><option value="gem">숨은 보석</option><option value="mature">성숙/유지보수</option>
      <option value="hype">하이프 주의</option><option value="bad">스타 조작 의심</option><option value="doc">문서/큐레이션형</option><option value="quick">심층 분석 대기</option>
    </select>
    <label class="meta"><input type="checkbox" id="fArch"> 아카이브 제외</label>
  </div>
  <nav id="nav">
    <button data-t="trend" class="on">급상승</button>
    <button data-t="top">스타 순위</button>
    <button data-t="new">신규 루키</button>
    <button data-t="cat">분야별</button>
    <button data-t="growth">성장 순위</button>
    <button data-t="real">실속 분석</button>
    <button data-t="guide">안내</button>
  </nav>
</header>
<main id="main"></main>

<script src="data/data.js"></script>
<script>
const D = window.STAR_BOARD;
const $ = s => document.querySelector(s);
const main = $('#main');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => { if (n == null || isNaN(n)) return '-'; const a = Math.abs(n); return a >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : a >= 1e4 ? Math.round(n / 1e3) + 'k' : a >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(Math.round(n)); };
const ago = t => { if (!t) return '-'; const d = (Date.now() - Date.parse(t)) / 864e5; return d < 1 ? '오늘' : d < 45 ? Math.round(d) + '일 전' : d < 700 ? Math.round(d / 30) + '개월 전' : (d / 365).toFixed(1) + '년 전'; };
const col = v => v == null ? 'var(--muted)' : v >= 70 ? 'var(--good)' : v >= 50 ? 'var(--warn)' : 'var(--bad)';
const S = { tab: 'trend', period: 'daily', tlang: '', topLang: 'all', topSort: 'stars', newDays: null, cat: null, catSort: 'stars', gPeriod: 'd7', limit: 100, open: null };

if (!D) {
  main.innerHTML = `<div class="note warn">data/data.js가 없습니다. <code>node collect.mjs</code>를 실행하거나 GitHub Actions 수집이 한 번 돌고 나면 표시됩니다. README를 참고하세요.</div>`;
} else init();

function init() {
  const R = D.repos;
  const langs = {}; for (const r of Object.values(R)) if (r.l) langs[r.l] = (langs[r.l] || 0) + 1;
  Object.entries(langs).sort((a, b) => b[1] - a[1]).slice(0, 40).forEach(([l, c]) => $('#fLang').insertAdjacentHTML('beforeend', `<option value="${esc(l)}">${esc(l)} (${c})</option>`));
  const gen = new Date(D.generatedAt);
  $('#meta').innerHTML = `업데이트 ${gen.toLocaleString()} · 저장소 ${fmt(Object.keys(R).length)}개 · 심층 분석 ${fmt(D.deepCount)}개 · 스타 기록 ${D.history.days}일치 ` +
    (D.mode === 'deep' ? '<span class="badge" style="color:var(--good)">심층 모드</span>' : '<span class="badge" style="color:var(--warn)">간이 모드 (토큰 없음)</span>');
  S.newDays = D.rookieDays[0]; S.cat = D.categories[0]?.id;
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; S.limit = 100; S.open = null; document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x === b)); render(); });
  ['#q', '#fLang', '#fV', '#fArch'].forEach(s => $(s).addEventListener('input', () => { S.limit = 100; render(); }));
  main.addEventListener('click', onClick);
  render();
}

function passFilter(r) {
  if (!r) return false;
  const q = $('#q').value.trim().toLowerCase(), l = $('#fLang').value, v = $('#fV').value;
  if (l && r.l !== l) return false;
  if (v && r.sc?.v !== v) return false;
  if ($('#fArch').checked && r.a) return false;
  if (q && !(r.n.toLowerCase().includes(q) || (r.d || '').toLowerCase().includes(q) || (r.t || []).some(t => t.includes(q)))) return false;
  return true;
}

function chips(items, cur, attr) { return items.map(([v, label]) => `<button class="chip ${String(v) === String(cur) ? 'on' : ''}" data-${attr}="${esc(v)}">${esc(label)}</button>`).join(''); }

function table(rows, { extraHead = '', extra = () => '' } = {}) {
  rows = rows.filter(x => passFilter(D.repos[x.n]));
  if (!rows.length) return '<div class="note">조건에 맞는 저장소가 없습니다.</div>';
  const shown = rows.slice(0, S.limit);
  return `<table><tr><th>#</th><th>저장소</th><th>언어</th><th class="n">스타</th>${extraHead ? `<th class="n">${extraHead}</th>` : ''}<th>판정</th><th class="n">인기</th><th class="n">실효</th><th class="n">신뢰</th><th class="n">push</th></tr>
  ${shown.map((x, i) => rowHtml(D.repos[x.n], i + 1, extraHead ? extra(x) : null)).join('')}</table>
  ${rows.length > S.limit ? `<button class="more" data-more="1">더 보기 (${rows.length - S.limit}개 남음)</button>` : ''}`;
}

function rowHtml(r, i, extraCell) {
  const sc = r.sc || {};
  const open = S.open === r.n;
  return `<tr class="row" data-open="${esc(r.n)}"><td class="rank">${i}</td>
  <td><a class="name" href="https://github.com/${esc(r.n)}" target="_blank">${esc(r.n)}</a>${r.a ? ' <span class="badge">archived</span>' : ''}
    <div class="desc">${esc((r.d || '').slice(0, 180))}</div>${r.t?.length ? `<div class="topics">${r.t.slice(0, 5).map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}</td>
  <td class="meta">${esc(r.l || '-')}</td><td class="n">${fmt(r.s)}</td>${extraCell != null ? `<td class="n">${extraCell}</td>` : ''}
  <td><span class="v v-${sc.v}">${esc(sc.vt || '-')}</span></td>
  <td class="n s" style="color:${col(sc.pop)}">${sc.pop ?? '-'}</td>
  <td class="n s" style="color:${col(sc.quick ? null : sc.util)}" title="${sc.quick ? '간이 점수 (커밋/이슈/참여자 미반영)' : ''}">${sc.util ?? '-'}${sc.quick && sc.util != null ? '<span class="meta">*</span>' : ''}</td>
  <td class="n s" style="color:${col(sc.trust)}">${sc.trust ?? '-'}</td><td class="n meta">${ago(r.p)}</td></tr>
  ${open ? `<tr class="detail"><td colspan="${extraCell != null ? 10 : 9}">${detail(r)}</td></tr>` : ''}`;
}

function detail(r) {
  const d = r.deep, sc = r.sc || {};
  const m = (k, v) => `<div class="m"><div class="k">${k}</div><div class="val">${v}</div></div>`;
  const iss = d ? d.oi + d.ci : 0;
  const names = { activity: '개발 활동', recency: '관리 상태', community: '커뮤니티', issues: '이슈 처리', prs: 'PR 머지', forks: '포크 비율', adoption: '실사용량', releases: '릴리스' };
  return `<div class="dgrid">
    ${m('스타 / 포크', `${fmt(r.s)} / ${fmt(r.f)} <span class="meta">(${r.s ? ((r.f / r.s) * 100).toFixed(1) : '-'}%)</span>`)}
    ${m('스타 증가 1일/7일/30일', r.g ? `${r.g.d1 != null ? '+' + fmt(r.g.d1) : '-'} / ${r.g.d7 != null ? '+' + fmt(r.g.d7) : '-'} / ${r.g.d30 != null ? '+' + fmt(r.g.d30) : '-'}` : (sc.g7 != null ? `7일 약 +${fmt(sc.g7)} (추정)` : '기록 쌓이는 중'))}
    ${m('생성 / 최근 push', `${r.c ? r.c.slice(0, 10) : '-'} / ${ago(r.p)}`)}
    ${m('라이선스', esc(r.lic || '없음'))}
    ${d ? m('커밋 90일 / 1년', `${fmt(d.c90)} / ${fmt(d.c365)}`) : ''}
    ${d ? m('참여자 (추정)', fmt(d.ppl)) : ''}
    ${d ? m('이슈 해결', `${fmt(d.ci)} / ${fmt(iss)} <span class="meta">(${iss ? Math.round((d.ci / iss) * 100) : '-'}%)</span>`) : ''}
    ${d ? m('머지된 PR', fmt(d.mp)) : ''}
    ${d ? m('최근 릴리스', d.lr ? `${esc(d.tag || '')} · ${ago(d.lr)}` : '없음') : ''}
    ${m('패키지 월 다운로드', r.dl ? `<a href="${esc(r.dl.u)}" target="_blank">${esc(r.dl.e)}</a> ${fmt(r.dl.m)}` : '-')}
    ${d ? m('최근 스타 계정 표본', `${d.sgN}명 중 의심 ${d.sgSusp}명 · 24h 최대 ${d.sgBurst ?? '-'}명`) : ''}
  </div>
  ${r.why?.length ? `<ul class="why">${r.why.map(([s, t]) => `<li><span class="${s === '+' ? 'p' : s === '-' ? 'mi' : 'z'}">${s === '+' ? '▲' : s === '-' ? '▼' : '•'}</span> ${esc(t)}</li>`).join('')}</ul>` : ''}
  <div class="meta" style="margin:6px 0">${Object.entries(sc.comp || {}).map(([k, v]) => `${names[k]} <b style="color:${col(v)}">${v ?? '–'}</b>`).join(' · ')}</div>
  ${d?.sgFlag?.length ? `<div class="meta">의심 계정 예시: ${d.sgFlag.map(l => `<a href="https://github.com/${esc(l)}" target="_blank">${esc(l)}</a>`).join(', ')}</div>` : ''}
  ${sc.quick ? '<div class="meta">* 간이 모드: 커밋, 참여자, 이슈, 가짜 스타 검사는 토큰이 있는 수집(Actions)에서 채워집니다.</div>' : ''}
  <div style="margin-top:8px"><a href="https://github.com/${esc(r.n)}" target="_blank">GitHub</a>${r.hp ? ` · <a href="${esc(r.hp)}" target="_blank">홈페이지</a>` : ''} · <a href="https://star-history.com/#${esc(r.n)}&Date" target="_blank">star-history</a></div>`;
}

function sortRows(rows, by) {
  const R = D.repos, k = {
    stars: x => R[x.n]?.s || 0, util: x => R[x.n]?.sc?.util ?? -1, pop: x => R[x.n]?.sc?.pop ?? -1, growth: x => R[x.n]?.sc?.g7 ?? -1,
    trust: x => R[x.n]?.sc?.trust ?? -1, spd: x => (R[x.n]?.s || 0) / Math.max(1, (Date.now() - Date.parse(R[x.n]?.c || Date.now())) / 864e5),
  }[by];
  return k ? [...rows].sort((a, b) => k(b) - k(a)) : rows;
}
const sortSel = (id, cur, opts) => `<select data-sort="${id}">${opts.map(([v, l]) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
const SORTS = [['stars', '스타순'], ['util', '실효성순'], ['pop', '인기도순'], ['growth', '최근 성장순'], ['trust', '신뢰도순']];

function render() {
  const t = S.tab;
  let h = '';
  if (D.mode !== 'deep' && t !== 'guide') h += `<div class="note warn">간이 모드 데이터입니다. 커밋, 참여자, 이슈 해결률, 가짜 스타 검사가 빠져 있어 판정이 "심층 분석 대기"로 표시됩니다. GitHub Actions로 배포하면 자동으로 심층 모드로 수집됩니다 (안내 탭).</div>`;
  if (t === 'trend') {
    const P = [['daily', '오늘'], ['weekly', '이번 주'], ['monthly', '이번 달']];
    h += `<div class="sub">${chips(P, S.period, 'period')}<span style="width:12px"></span>${chips(D.trendingLanguages.map(l => [l, l || '전체 언어']), S.tlang, 'tlang')}</div>`;
    const list = D.trending[`${S.period}:${S.tlang || 'all'}`] || [];
    h += `<div class="note">GitHub Trending 기준. "+스타"는 해당 기간 동안 늘어난 스타 수입니다. 행을 클릭하면 실효성 근거가 펼쳐집니다.</div>`;
    h += table(list, { extraHead: '+스타', extra: x => `<span class="gain">+${fmt(x.g)}</span>` });
  } else if (t === 'top') {
    h += `<div class="sub">${chips([['all', '전체']].concat(D.topLanguages.map(l => [l, l])), S.topLang, 'toplang')}<span style="flex:1"></span>${sortSel('topSort', S.topSort, SORTS)}</div>`;
    h += table(sortRows((D.top[S.topLang] || []).map(n => ({ n })), S.topSort), { extraHead: '7일 증가', extra: x => growthCell(D.repos[x.n]) });
  } else if (t === 'new') {
    h += `<div class="sub">${chips(D.rookieDays.map(d => [d, `최근 ${d}일 생성`]), S.newDays, 'newdays')}</div>`;
    h += `<div class="note">최근 생성된 저장소를 하루 평균 스타 순으로 정렬했습니다. 짧은 기간에 스타가 폭증한 곳은 신뢰도 점수를 꼭 확인하세요.</div>`;
    h += table(sortRows((D.rookies[S.newDays] || []).map(n => ({ n })), 'spd'), { extraHead: '스타/일', extra: x => { const r = D.repos[x.n]; return `<b>${fmt(r.s / Math.max(1, (Date.now() - Date.parse(r.c)) / 864e5))}</b>`; } });
  } else if (t === 'cat') {
    h += `<div class="cards">${D.categories.map(c => { const rs = c.repos.map(n => D.repos[n]);
      const good = rs.filter(r => ['good', 'gem', 'mature'].includes(r.sc?.v)).length;
      return `<div class="card ${c.id === S.cat ? 'on' : ''}" data-cat="${c.id}"><b>${esc(c.name)}</b><div class="meta">${c.repos.length}개 · 최고 ${esc(c.repos[0] || '-')}</div><div class="meta">${c.topics.map(x => '#' + x).join(' ')}${D.mode === 'deep' ? ` · 검증 ${good}개` : ''}</div></div>`; }).join('')}</div>`;
    const c = D.categories.find(x => x.id === S.cat);
    if (c) { h += `<div class="sub"><b>${esc(c.name)}</b><span style="flex:1"></span>${sortSel('catSort', S.catSort, SORTS)}</div>`;
      h += table(sortRows(c.repos.map(n => ({ n })), S.catSort), { extraHead: '7일 증가', extra: x => growthCell(D.repos[x.n]) }); }
  } else if (t === 'growth') {
    const P = [['d1', '1일'], ['d7', '7일'], ['d30', '30일']];
    h += `<div class="sub">${chips(P, S.gPeriod, 'gperiod')}</div>`;
    const rows = Object.values(D.repos).filter(r => r.g?.[S.gPeriod] != null).map(r => ({ n: r.n, g: r.g[S.gPeriod] })).sort((a, b) => b.g - a.g);
    if (!rows.length) h += `<div class="note">이 대시보드가 직접 쌓은 스타 기록 기반 순위입니다. 기록이 ${D.history.days}일치라 아직 표시할 데이터가 없습니다. 매일 수집되면 1일 → 7일 → 30일 순위가 차례로 채워집니다. 그 전까지는 급상승 탭(GitHub Trending)을 참고하세요.</div>`;
    else { h += `<div class="note">이 대시보드가 매일 저장한 스타 스냅샷을 비교한 실측 증가량입니다 (기록 ${D.history.days}일치).</div>`;
      h += table(rows, { extraHead: '증가', extra: x => `<span class="gain">+${fmt(x.g)}</span>` }); }
  } else if (t === 'real') h += realView();
  else h += guide();
  main.innerHTML = h;
}

function growthCell(r) { if (r.g?.d7 != null) return `<span class="gain">+${fmt(r.g.d7)}</span>`; if (r.sc?.g7 != null) return `<span class="meta">~+${fmt(r.sc.g7)}</span>`; return '<span class="meta">-</span>'; }

function realView() {
  const all = Object.values(D.repos).filter(r => passFilter({ ...r, sc: { ...r.sc, v: $('#fV').value || r.sc?.v } }));
  const deep = all.filter(r => !r.sc.quick && r.sc.util != null);
  const pts = (deep.length ? deep : all.filter(r => r.sc.util != null));
  const W = 620, H = 380, P = 40;
  const colorOf = v => ({ good: '#3fb950', hype: '#d29922', bad: '#f85149', gem: '#a371f7', mature: '#a371f7', doc: '#39c5cf' }[v] || '#8b949e');
  const x = v => P + (v / 100) * (W - P - 10), y = v => H - P - (v / 100) * (H - P - 10);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%">`;
  svg += `<rect x="${x(55)}" y="${y(100)}" width="${x(100) - x(55)}" height="${y(55) - y(100)}" fill="#2ea04312"/><rect x="${x(55)}" y="${y(55)}" width="${x(100) - x(55)}" height="${y(0) - y(55)}" fill="#d2992212"/><rect x="${x(0)}" y="${y(100)}" width="${x(55) - x(0)}" height="${y(55) - y(100)}" fill="#a371f710"/>`;
  svg += `<text x="${x(97)}" y="${y(97)}" text-anchor="end">검증된 인기</text><text x="${x(97)}" y="${y(3)}" text-anchor="end">하이프 주의</text><text x="${x(3)}" y="${y(97)}">숨은 보석</text><text x="${x(3)}" y="${y(3)}">초기/정체</text>`;
  svg += `<line x1="${P}" y1="${H - P}" x2="${W - 10}" y2="${H - P}" stroke="#30363d"/><line x1="${P}" y1="10" x2="${P}" y2="${H - P}" stroke="#30363d"/>`;
  svg += `<text x="${(W + P) / 2}" y="${H - 10}" text-anchor="middle">인기도 →</text><text x="12" y="${H / 2}" transform="rotate(-90 12 ${H / 2})" text-anchor="middle">실효성 →</text>`;
  svg += pts.map(r => `<circle cx="${x(r.sc.pop).toFixed(1)}" cy="${y(r.sc.util).toFixed(1)}" r="${Math.max(2.5, Math.min(9, Math.log10(r.s + 1) * 1.6))}" fill="${colorOf(r.sc.v)}" fill-opacity=".55" data-open="${esc(r.n)}" style="cursor:pointer"><title>${esc(r.n)} · 인기 ${r.sc.pop} · 실효 ${r.sc.util} · ${esc(r.sc.vt)}</title></circle>`).join('');
  svg += '</svg>';
  const list = (v, title, by = 's') => { const rs = all.filter(r => (Array.isArray(v) ? v : [v]).includes(r.sc.v)).sort((a, b) => (b[by] || 0) - (a[by] || 0)).slice(0, 15);
    return `<div class="box"><h3>${title} <span class="meta">(${all.filter(r => (Array.isArray(v) ? v : [v]).includes(r.sc.v)).length}개)</span></h3>${rs.length ? `<table class="mini">${rs.map(r => `<tr><td><a href="https://github.com/${esc(r.n)}" target="_blank">${esc(r.n)}</a><div class="meta">${esc((r.why || []).slice(0, 2).map(w => w[1]).join(' · '))}</div></td><td class="n">${fmt(r.s)}</td><td class="n" style="color:${col(r.sc.util)}">${r.sc.util ?? '-'}</td></tr>`).join('')}</table>` : '<div class="meta">해당 없음</div>'}</div>`; };
  return `<div class="two"><div class="box"><h3>인기도 x 실효성 분포 <span class="meta">(${deep.length ? '심층 분석 ' + deep.length : '간이 ' + pts.length}개, 점 크기 = 스타)</span></h3>${svg}
    <div class="legend"><span><i style="background:#3fb950"></i>검증된 인기</span><span><i style="background:#a371f7"></i>숨은 보석/성숙</span><span><i style="background:#d29922"></i>하이프 주의</span><span><i style="background:#f85149"></i>조작 의심</span><span><i style="background:#39c5cf"></i>문서형</span></div></div>
    ${list('gem', '숨은 보석: 스타는 적지만 실사용/관리가 탄탄')}</div><div class="two" style="margin-top:14px">
    ${list('hype', '하이프 주의: 스타 대비 실사용 신호 약함')}${list('bad', '스타 조작 의심: 최근 스타 계정 품질 낮음')}</div><div class="two" style="margin-top:14px">
    ${list('mature', '성숙/유지보수: 개발은 느리지만 다운로드 많음')}${list('good', '검증된 인기 Top 15')}</div>`;
}

function guide() {
  return `<div class="box guide">
  <h3>무엇을 보여주나</h3>
  <ul><li><b>급상승</b>: GitHub Trending(오늘/이번 주/이번 달, 언어별)과 기간 내 증가 스타</li>
  <li><b>스타 순위</b>: 누적 스타 Top 200 + 언어별 Top 50</li>
  <li><b>신규 루키</b>: 최근 7일/30일 안에 생성된 저장소를 하루 평균 스타 순으로</li>
  <li><b>분야별</b>: AI 코딩 에이전트, MCP, LLM, RAG, 보안, 생체인증, 컴퓨터 비전, 임베디드 등 (collect.mjs의 categories에서 수정)</li>
  <li><b>성장 순위</b>: 매일 저장한 스타 스냅샷으로 계산한 실측 1일/7일/30일 증가량</li>
  <li><b>실속 분석</b>: 인기도 x 실효성 분포와 숨은 보석 / 하이프 / 조작 의심 목록</li></ul>
  <h3>점수</h3>
  <ul><li><b>인기도</b>: 누적 스타(로그, 10만=만점) 60% + 최근 7일 증가(로그, 5천=만점) 40%</li>
  <li><b>실효성</b>: 90일 커밋 22%, 참여자 15%, 이슈 해결률 13%, 머지 PR 10%, 포크/스타 10%, 패키지 다운로드 12%, 최근 push 10%, 최근 릴리스 8% (없는 항목은 제외 후 재정규화)</li>
  <li><b>신뢰도</b>: 최근 스타를 누른 계정 30명 표본의 가짜 패턴(팔로워 0, 팔로잉 0, 저장소 0, 빈 프로필, 가입 직후 스타)과 24시간 내 몰림</li>
  <li><b>판정</b>: 검증된 인기(인기 55+ & 실효 55+), 하이프 주의(인기 55+ & 실효 55 미만), 숨은 보석(인기 55 미만 & 실효 55+), 성숙/유지보수(하이프 조건이지만 다운로드 많음), 스타 조작 의심(신뢰도 50 미만), 문서/큐레이션형(awesome 리스트, 프롬프트 모음 등 코드가 아닌 저장소)</li></ul>
  <h3>한계</h3>
  <ul><li>GitHub "Used by"(의존 저장소 수)는 공식 API가 없어 미포함. 다운로드는 루트 package.json / pyproject.toml / Cargo.toml에서 이름을 찾은 경우만 조회.</li>
  <li>가짜 스타 판정은 휴리스틱입니다. 정상 프로젝트에도 저활동 계정이 섞이므로 단독 근거로 단정하지 마세요.</li>
  <li>Trending은 GitHub 페이지 구조가 바뀌면 수집이 깨질 수 있습니다 (collect.mjs의 parseTrending).</li></ul>
  <h3>자동 업데이트</h3>
  <p>README.md 참고: 이 폴더를 GitHub 저장소로 올리고 Pages를 켜면 매일 06:00(KST)에 Actions가 수집해서 사이트를 갱신합니다. 토큰은 Actions 기본 GITHUB_TOKEN을 쓰므로 따로 만들 필요가 없습니다.</p></div>`;
}

function onClick(e) {
  const el = e.target.closest('[data-period],[data-tlang],[data-toplang],[data-newdays],[data-cat],[data-gperiod],[data-more],[data-open]');
  if (!el || e.target.closest('a')) return;
  const ds = el.dataset;
  if (ds.period) S.period = ds.period; else if (ds.tlang !== undefined) S.tlang = ds.tlang; else if (ds.toplang) S.topLang = ds.toplang;
  else if (ds.newdays) S.newDays = +ds.newdays; else if (ds.cat) { S.cat = ds.cat; S.limit = 100; } else if (ds.gperiod) S.gPeriod = ds.gperiod;
  else if (ds.more) S.limit += 100;
  else if (ds.open) {
    if (S.tab === 'real') { $('#q').value = ds.open; S.tab = 'top'; S.topLang = 'all'; document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x.dataset.t === 'top'));
      // 전체 목록에서 찾을 수 있도록 임시로 전체 저장소 표시
      S.open = ds.open; renderSearchAll(ds.open); return; }
    S.open = S.open === ds.open ? null : ds.open;
  }
  render();
}
function renderSearchAll(name) {
  main.innerHTML = `<div class="note">"${esc(name)}" 상세 · 검색창을 비우면 원래 목록으로 돌아갑니다.</div>` + table([{ n: name }]);
}
main.addEventListener('change', e => { const s = e.target.dataset.sort; if (s) { S[s] = e.target.value; render(); } });
</script>
</body>
</html>
